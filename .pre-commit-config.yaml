repos:
  - repo: local
    hooks:
      - id: dart-format
        name: Dart format
        entry: dart format --set-exit-if-changed .
        language: system
        pass_filenames: false

      - id: flutter-analyze
        name: Flutter analyze
        entry: bash -c "flutter analyze --no-fatal-warnings || true"
        language: system
        pass_filenames: false

      - id: dart-fix
        name: Apply Dart fixes
        entry: dart fix --apply
        language: system
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
